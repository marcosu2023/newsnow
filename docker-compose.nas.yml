services:
  newsnow:
    build: .
    container_name: newsnow
    ports:
      - '4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      # 使用公共 RSSHub，无需自建
      # - RSSHUB_URL=http://rsshub:1200
      # 代理设置（访问 Reuters/WSJ/FT/Google翻译需要）
      # 改成你的代理地址，例如 http://192.168.1.1:7890
      # - HTTP_PROXY=http://你的代理地址:端口
      # - HTTPS_PROXY=http://你的代理地址:端口
      # - NO_PROXY=localhost,127.0.0.1
    restart: unless-stopped

volumes:
  newsnow_data:
    name: newsnow_data
