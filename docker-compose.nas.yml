services:
  newsnow:
    build: .
    container_name: newsnow
    ports:
      - '4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - RSSHUB_URL=http://rsshub:1200
      # 可选：Upstash Redis 缓存（viral-scan 用）
      # - UPSTASH_REDIS_REST_URL=
      # - UPSTASH_REDIS_REST_TOKEN=
    depends_on:
      - rsshub
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    ports:
      - '1200:1200'
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
    restart: unless-stopped

volumes:
  newsnow_data:
    name: newsnow_data
