services:
  newsnow:
    build: .
    container_name: newsnow
    ports:
      - '4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      # 使用公共 RSSHub，无需自建
      # - RSSHUB_URL=http://rsshub:1200
    restart: unless-stopped

volumes:
  newsnow_data:
    name: newsnow_data
